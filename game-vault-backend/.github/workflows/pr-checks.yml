name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Compile & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile
        run: ./mvnw -B compile

      - name: Unit tests
        run: ./mvnw -B test
