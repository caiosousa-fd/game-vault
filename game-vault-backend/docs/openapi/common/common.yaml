components:
  parameters:
    GameIdPath:
      name: id
      in: path
      required: true
      description: Unique game-copy identifier.
      schema:
        type: string
        format: uuid
      example: e89ea45b-904f-44ed-8d1d-5a5d691d348a

    GameQuery:
      name: query
      in: query
      required: false
      description: Case-insensitive partial match against the game title.
      schema:
        type: string
        minLength: 1
        maxLength: 200
      example: mario

    PlatformIdQuery:
      name: platformId
      in: query
      required: false
      description: Return only games for this platform.
      schema:
        type: string
        format: uuid

    GameFormatQuery:
      name: format
      in: query
      required: false
      description: Return only games with this ownership format.
      schema:
        $ref: '#/components/schemas/GameFormat'

    GameStatusQuery:
      name: status
      in: query
      required: false
      description: Return only games with this playing status.
      schema:
        $ref: '#/components/schemas/GameStatus'

    RegionQuery:
      name: region
      in: query
      required: false
      description: Return only games from this release region.
      schema:
        $ref: '#/components/schemas/Region'

    ConditionQuery:
      name: condition
      in: query
      required: false
      description: Return only physical games with this condition.
      schema:
        $ref: '#/components/schemas/ItemCondition'

    HasBoxQuery:
      name: hasBox
      in: query
      required: false
      description: Filter physical games by original-box availability.
      schema:
        type: boolean

    HasManualQuery:
      name: hasManual
      in: query
      required: false
      description: Filter physical games by manual availability.
      schema:
        type: boolean

    PageQuery:
      name: page
      in: query
      required: false
      description: Zero-based page number.
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeQuery:
      name: size
      in: query
      required: false
      description: Number of results per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    SortQuery:
      name: sort
      in: query
      required: false
      description: Sort field followed by direction.
      schema:
        type: string
        default: createdAt,desc
        pattern: '^(title|platformName|purchaseDate|purchasePrice|createdAt|updatedAt),(asc|desc)$'
      example: title,asc

  schemas:
    GameFormat:
      type: string
      enum:
        - PHYSICAL
        - DIGITAL

    GameStatus:
      type: string
      enum:
        - BACKLOG
        - PLAYING
        - COMPLETED
        - ABANDONED

    Region:
      type: string
      enum:
        - PAL
        - NTSC_U
        - NTSC_J
        - REGION_FREE
        - OTHER

    ItemCondition:
      type: string
      enum:
        - POOR
        - FAIR
        - GOOD
        - VERY_GOOD
        - EXCELLENT
        - NEW

    PlatformSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100